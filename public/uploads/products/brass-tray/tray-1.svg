<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2b2620"/>
      <stop offset="60%" stop-color="#181512"/>
      <stop offset="100%" stop-color="#0a0907"/>
    </radialGradient>
    <radialGradient id="trayBrass" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff0be"/>
      <stop offset="30%" stop-color="#dfbe76"/>
      <stop offset="65%" stop-color="#9a7a30"/>
      <stop offset="90%" stop-color="#604918"/>
      <stop offset="100%" stop-color="#403010"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <ellipse cx="400" cy="710" rx="270" ry="40" fill="#000" opacity="0.6"/>

  <g filter="url(#shadow)" transform="translate(400, 480)">
    <!-- Outer scalloped rim of the antique tray -->
    <circle cx="0" cy="0" r="250" fill="url(#trayBrass)" stroke="#ffe185" stroke-width="4"/>
    <circle cx="0" cy="0" r="236" fill="none" stroke="#503d15" stroke-width="2" stroke-dasharray="6 3"/>
    
    <!-- Concentric hand-chiseled arabesque bands -->
    <circle cx="0" cy="0" r="215" fill="none" stroke="#664f1c" stroke-width="4"/>
    <circle cx="0" cy="0" r="185" fill="none" stroke="#775d23" stroke-width="1.5" stroke-dasharray="8 4"/>

    <!-- Calligraphy Inscription Ring (Traditional Egyptian Poetic Inscription) -->
    <circle cx="0" cy="0" r="150" fill="#38290f" opacity="0.15"/>
    <g font-family="Georgia, serif" font-size="15" fill="#302008" text-anchor="middle" letter-spacing="4">
      <text x="0" y="-160">يا دار نلتِ المنى والبشر والإقبال</text>
      <text x="0" y="175">عزٌ ودام الهنا في سائر الأحوال</text>
    </g>

    <!-- Star Polygon Islamic Geometry Rosette Center -->
    <circle cx="0" cy="0" r="120" fill="url(#trayBrass)" stroke="#503d15" stroke-width="2"/>
    <!-- 8-pointed star in center -->
    <polygon points="0,-100 28,-38 100,-38 42,6 64,74 0,34 -64,74 -42,6 -100,-38 -28,-38" fill="#755a22" stroke="#fff0be" stroke-width="2"/>
    <circle cx="0" cy="0" r="35" fill="url(#trayBrass)" stroke="#503d15" stroke-width="2"/>
    <circle cx="0" cy="0" r="12" fill="#3a280d"/>

    <!-- Dual Antique Brass Handles with Filigree -->
    <path d="M -255 -30 C -290 -30 -290 30 -255 30" fill="none" stroke="url(#trayBrass)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 255 -30 C 290 -30 290 30 255 30" fill="none" stroke="url(#trayBrass)" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Museum Badge Placard Overlay -->
  <g transform="translate(250, 830)">
    <rect width="300" height="70" rx="6" fill="#1c1b18" stroke="#dfbe76" stroke-width="1.2" opacity="0.92"/>
    <text x="150" y="28" font-family="serif" font-size="14" fill="#dfbe76" text-anchor="middle" letter-spacing="2">CAIRO HERITAGE c. 1930</text>
    <text x="150" y="50" font-family="sans-serif" font-size="12" fill="#c7c3bb" text-anchor="middle">صينية نحاس مطروقة يدوياً – خان الخليلي</text>
  </g>
</svg>