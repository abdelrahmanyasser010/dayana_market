<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#22211e"/>
      <stop offset="60%" stop-color="#141312"/>
      <stop offset="100%" stop-color="#0a0a09"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="50%" stop-color="#cccccc"/>
      <stop offset="100%" stop-color="#777777"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <!-- Macro view of Shutter Dial and Film Advance Cocking Gear -->
  <g transform="translate(400, 480)">
    <circle cx="0" cy="0" r="230" fill="#181818" stroke="url(#chrome)" stroke-width="10"/>
    <circle cx="0" cy="0" r="190" fill="#292929"/>
    <!-- Engraved Shutter Speeds -->
    <g font-family="sans-serif" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle" dominant-baseline="central">
      <text x="0" y="-140" fill="#dfbe76">B</text>
      <text x="70" y="-120">1</text>
      <text x="130" y="-60">2</text>
      <text x="145" y="10">4</text>
      <text x="125" y="80">8</text>
      <text x="70" y="130">15</text>
      <text x="0" y="145">30</text>
      <text x="-70" y="130">60</text>
      <text x="-125" y="80">125</text>
      <text x="-145" y="10">250</text>
      <text x="-130" y="-60">500</text>
      <text x="-70" y="-120">1000</text>
    </g>

    <!-- Center release button -->
    <circle cx="0" cy="0" r="80" fill="url(#chrome)" stroke="#444" stroke-width="3"/>
    <circle cx="0" cy="0" r="30" fill="#151515"/>
    <text x="0" y="6" font-family="sans-serif" font-size="12" fill="#dfbe76" font-weight="bold" text-anchor="middle">THREAD</text>
  </g>
</svg>