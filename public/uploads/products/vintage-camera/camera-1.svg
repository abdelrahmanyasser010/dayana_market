<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a2825"/>
      <stop offset="60%" stop-color="#191816"/>
      <stop offset="100%" stop-color="#0a0a09"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d4d4d4"/>
      <stop offset="70%" stop-color="#a0a0a0"/>
      <stop offset="100%" stop-color="#707070"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="50%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>
    <radialGradient id="lensGlass" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#4aa3df" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#1f4470"/>
      <stop offset="60%" stop-color="#0e1f33"/>
      <stop offset="90%" stop-color="#040b12"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <ellipse cx="400" cy="730" rx="280" ry="45" fill="#000" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Main Camera Body -->
    <!-- Leather Middle -->
    <rect x="180" y="410" width="440" height="240" rx="20" fill="url(#leather)" stroke="#333" stroke-width="2"/>
    
    <!-- Chrome Top Plate -->
    <path d="M 180 430 Q 180 340 210 340 L 590 340 Q 620 340 620 430 Z" fill="url(#chrome)" stroke="#666"/>
    <!-- Chrome Bottom Plate -->
    <rect x="180" y="630" width="440" height="40" rx="10" fill="url(#chrome)" stroke="#666"/>

    <!-- Viewfinder Windows on Top Plate -->
    <rect x="230" y="365" width="40" height="26" rx="4" fill="#0d1b2a" stroke="#888" stroke-width="2"/>
    <rect x="290" y="370" width="22" height="18" rx="3" fill="#dfbe76" stroke="#888" stroke-width="1.5"/>
    <rect x="520" y="365" width="48" height="28" rx="4" fill="#0d1b2a" stroke="#888" stroke-width="2"/>

    <!-- Dials and Knobs on Top -->
    <!-- Film Advance Lever -->
    <rect x="200" y="325" width="55" height="15" rx="4" fill="url(#chrome)" stroke="#555"/>
    <!-- Shutter Speed Dial -->
    <rect x="270" y="318" width="48" height="22" rx="3" fill="url(#chrome)" stroke="#555"/>
    <!-- Shutter Release Button -->
    <ellipse cx="340" cy="335" rx="14" ry="7" fill="url(#chrome)" stroke="#444"/>
    <rect x="334" y="322" width="12" height="14" fill="url(#chrome)"/>
    <!-- Film Rewind Crank -->
    <rect x="550" y="325" width="45" height="15" rx="3" fill="url(#chrome)" stroke="#555"/>

    <!-- Engraved Vintage Brand -->
    <text x="400" y="385" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#222" text-anchor="middle" letter-spacing="4">FUJICA 35</text>
    <text x="400" y="402" font-family="sans-serif" font-size="9" fill="#555" text-anchor="middle" letter-spacing="2">AUTO-M / 1965</text>

    <!-- Large Mechanical Optical Lens Assembly -->
    <!-- Outer Knurled Ring -->
    <circle cx="400" cy="530" r="140" fill="#181818" stroke="url(#chrome)" stroke-width="6"/>
    <!-- Aperture Ring with Markings -->
    <circle cx="400" cy="530" r="122" fill="#242424" stroke="#444" stroke-width="2"/>
    <g font-family="sans-serif" font-size="10" font-weight="bold" fill="#dfbe76" text-anchor="middle">
      <text x="400" y="420">f/1.9</text>
      <text x="445" y="430">2.8</text>
      <text x="480" y="460">4</text>
      <text x="495" y="500">5.6</text>
      <text x="490" y="550">8</text>
      <text x="465" y="600">11</text>
      <text x="420" y="625">16</text>
    </g>

    <!-- Inner Chrome Bezel -->
    <circle cx="400" cy="530" r="100" fill="none" stroke="url(#chrome)" stroke-width="8"/>
    <!-- Lens Element Glass -->
    <circle cx="400" cy="530" r="92" fill="url(#lensGlass)"/>
    <!-- Glass Reflections -->
    <ellipse cx="370" cy="500" rx="35" ry="20" transform="rotate(-30 370 500)" fill="#ffffff" opacity="0.35"/>
    <circle cx="430" cy="560" r="15" fill="#dfbe76" opacity="0.3"/>
    
    <!-- Shutter Blades Aperture Hexagon -->
    <polygon points="400,510 417,520 417,540 400,550 383,540 383,520" fill="#050a10" stroke="#dfbe76" stroke-width="1"/>
  </g>

  <!-- Museum Badge Placard Overlay -->
  <g transform="translate(250, 830)">
    <rect width="300" height="70" rx="6" fill="#1c1b18" stroke="#dfbe76" stroke-width="1.2" opacity="0.92"/>
    <text x="150" y="28" font-family="serif" font-size="14" fill="#dfbe76" text-anchor="middle" letter-spacing="2">VINTAGE ANALOG 1960s</text>
    <text x="150" y="50" font-family="sans-serif" font-size="12" fill="#c7c3bb" text-anchor="middle">كاميرا فيلمية رينجفايندر يابانية كلاسيكية</text>
  </g>
</svg>