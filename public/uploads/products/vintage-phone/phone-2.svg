<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#22201d"/>
      <stop offset="60%" stop-color="#141312"/>
      <stop offset="100%" stop-color="#0a0a09"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cccccc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#777777"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <!-- Macro view of dial and vintage manufacturer plate -->
  <g transform="translate(400, 480)">
    <circle cx="0" cy="0" r="240" fill="#151515" stroke="#333" stroke-width="6"/>
    <circle cx="0" cy="0" r="220" fill="#e8dec8"/>
    
    <!-- Dial Numbers in Macro -->
    <g font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#222" text-anchor="middle" dominant-baseline="central">
      <text x="0" y="-160">1</text>
      <text x="95" y="-130">2</text>
      <text x="160" y="-50">3</text>
      <text x="165" y="55">4</text>
      <text x="105" y="135">5</text>
      <text x="0" y="165">6</text>
      <text x="-105" y="135">7</text>
      <text x="-165" y="55">8</text>
      <text x="-160" y="-50">9</text>
      <text x="-95" y="-130">0</text>
    </g>

    <!-- Finger Wheel in perspective -->
    <circle cx="0" cy="0" r="190" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="8"/>
    <circle cx="0" cy="-160" r="28" fill="rgba(255,255,255,0.2)" stroke="#555" stroke-width="3"/>
    <circle cx="95" cy="-130" r="28" fill="rgba(255,255,255,0.2)" stroke="#555" stroke-width="3"/>
    <circle cx="160" cy="-50" r="28" fill="rgba(255,255,255,0.2)" stroke="#555" stroke-width="3"/>
    <circle cx="165" cy="55" r="28" fill="rgba(255,255,255,0.2)" stroke="#555" stroke-width="3"/>
    <circle cx="105" cy="135" r="28" fill="rgba(255,255,255,0.2)" stroke="#555" stroke-width="3"/>
    <circle cx="0" cy="165" r="28" fill="rgba(255,255,255,0.2)" stroke="#555" stroke-width="3"/>
    <circle cx="-105" cy="135" r="28" fill="rgba(255,255,255,0.2)" stroke="#555" stroke-width="3"/>
    <circle cx="-165" cy="55" r="28" fill="rgba(255,255,255,0.2)" stroke="#555" stroke-width="3"/>
    <circle cx="-160" cy="-50" r="28" fill="rgba(255,255,255,0.2)" stroke="#555" stroke-width="3"/>
    <circle cx="-95" cy="-130" r="28" fill="rgba(255,255,255,0.2)" stroke="#555" stroke-width="3"/>

    <!-- Center Brass Badge -->
    <circle cx="0" cy="0" r="70" fill="#c5a880" stroke="#8c6f32" stroke-width="4"/>
    <text x="0" y="-12" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">ERICSSON</text>
    <text x="0" y="10" font-family="serif" font-size="12" fill="#333" text-anchor="middle">STOCKHOLM</text>
    <text x="0" y="28" font-family="sans-serif" font-size="10" fill="#444" text-anchor="middle">MOD. 1952</text>
  </g>
</svg>