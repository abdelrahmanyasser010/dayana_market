<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#24211c"/>
      <stop offset="60%" stop-color="#141311"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </radialGradient>
    <radialGradient id="hornInterior" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1a06"/>
      <stop offset="40%" stop-color="#6e4f1a"/>
      <stop offset="70%" stop-color="#caa45a"/>
      <stop offset="95%" stop-color="#ffebb0"/>
      <stop offset="100%" stop-color="#886622"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <!-- Front View into Horn Petals -->
  <g transform="translate(400, 480)">
    <circle cx="0" cy="0" r="260" fill="url(#hornInterior)" stroke="#886622" stroke-width="4"/>
    <!-- 8 Fluted Petals Petal Spokes -->
    <g stroke="#3a2508" stroke-width="3">
      <line x1="0" y1="0" x2="0" y2="-260"/>
      <line x1="0" y1="0" x2="184" y2="-184"/>
      <line x1="0" y1="0" x2="260" y2="0"/>
      <line x1="0" y1="0" x2="184" y2="184"/>
      <line x1="0" y1="0" x2="0" y2="260"/>
      <line x1="0" y1="0" x2="-184" y2="184"/>
      <line x1="0" y1="0" x2="-260" y2="0"/>
      <line x1="0" y1="0" x2="-184" y2="-184"/>
    </g>
    <!-- Deep center vortex -->
    <circle cx="0" cy="0" r="60" fill="#120b02" stroke="#4a300a" stroke-width="4"/>
    <circle cx="0" cy="0" r="25" fill="#000"/>
  </g>
</svg>