<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2c2822"/>
      <stop offset="60%" stop-color="#181613"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </radialGradient>
    <linearGradient id="brassHorn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffecaa"/>
      <stop offset="35%" stop-color="#dfbe76"/>
      <stop offset="70%" stop-color="#9d7f35"/>
      <stop offset="100%" stop-color="#554115"/>
    </linearGradient>
    <linearGradient id="mahogany" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a2e1d"/>
      <stop offset="50%" stop-color="#3b1b0e"/>
      <stop offset="100%" stop-color="#230d05"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <ellipse cx="400" cy="740" rx="270" ry="45" fill="#000" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Wooden Cabinet Base -->
    <rect x="230" y="580" width="340" height="150" rx="8" fill="url(#mahogany)" stroke="#663322" stroke-width="2"/>
    <!-- Cabinet Moldings -->
    <rect x="210" y="570" width="380" height="20" rx="4" fill="#663322"/>
    <rect x="210" y="720" width="380" height="22" rx="4" fill="#663322"/>

    <!-- Brass Maker Plate on Cabinet -->
    <rect x="330" y="630" width="140" height="50" rx="4" fill="url(#brassHorn)" stroke="#554115"/>
    <text x="400" y="652" font-family="serif" font-size="12" font-weight="bold" fill="#221100" text-anchor="middle">HIS MASTER'S VOICE</text>
    <text x="400" y="668" font-family="sans-serif" font-size="9" fill="#442200" text-anchor="middle">LONDON c. 1910</text>

    <!-- Hand Crank / Manivelle on the Right -->
    <path d="M 570 650 L 620 650 L 620 620 L 640 620" fill="none" stroke="url(#brassHorn)" stroke-width="8" stroke-linecap="round"/>
    <rect x="635" y="605" width="16" height="30" rx="3" fill="#2a140b"/>

    <!-- Turntable Platter with Green Felt & 78 RPM Shellac Record -->
    <ellipse cx="400" cy="565" rx="145" ry="32" fill="#1b4d2e" stroke="url(#brassHorn)" stroke-width="3"/>
    <ellipse cx="400" cy="564" rx="130" ry="26" fill="#111111"/>
    <!-- Shellac grooves shimmer -->
    <ellipse cx="400" cy="564" rx="110" ry="20" fill="none" stroke="#252525" stroke-width="1.5"/>
    <ellipse cx="400" cy="564" rx="85" ry="15" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
    <!-- Record Center Label (Red Baidaphon/Gramophone label) -->
    <ellipse cx="400" cy="564" rx="40" ry="8" fill="#8b1e1e"/>
    <ellipse cx="400" cy="564" rx="5" ry="2" fill="url(#brassHorn)"/>

    <!-- Tonearm & Soundbox / Reproducer -->
    <path d="M 490 565 C 500 520 480 490 440 500 C 400 510 380 540 370 560" fill="none" stroke="url(#brassHorn)" stroke-width="10" stroke-linecap="round"/>
    <!-- Soundbox with steel needle resting on record -->
    <circle cx="370" cy="560" r="20" fill="url(#brassHorn)" stroke="#332211" stroke-width="2"/>
    <path d="M 368 575 L 366 585" stroke="#ccc" stroke-width="3"/>

    <!-- Magnificent Brass Flower Horn (Fluted Petals) -->
    <!-- Elbow support -->
    <path d="M 480 500 C 500 450 490 380 430 350" fill="none" stroke="url(#brassHorn)" stroke-width="22" stroke-linecap="round"/>

    <!-- Horn Body Flaring Out -->
    <!-- Outer Bell Petals in Flower Shape -->
    <path d="M 430 350 C 400 320 320 280 230 250 C 200 200 250 140 320 130 C 410 115 520 120 600 160 C 650 190 660 260 620 300 C 560 360 480 370 430 350 Z" fill="url(#brassHorn)" stroke="#ffe185" stroke-width="2"/>
    <!-- Fluted petal ribs -->
    <path d="M 430 350 Q 320 250 240 200" stroke="#775515" stroke-width="3" fill="none"/>
    <path d="M 430 350 Q 350 200 320 130" stroke="#775515" stroke-width="3" fill="none"/>
    <path d="M 430 350 Q 450 190 460 120" stroke="#775515" stroke-width="3" fill="none"/>
    <path d="M 430 350 Q 530 210 590 160" stroke="#775515" stroke-width="3" fill="none"/>
    <path d="M 430 350 Q 570 270 635 240" stroke="#775515" stroke-width="3" fill="none"/>
    <path d="M 430 350 Q 540 330 600 320" stroke="#775515" stroke-width="3" fill="none"/>
    
    <!-- Deep Interior Shading of Horn Throat -->
    <ellipse cx="430" cy="350" rx="35" ry="25" fill="#352309" stroke="#775515"/>
  </g>

  <!-- Museum Badge Placard Overlay -->
  <g transform="translate(250, 830)">
    <rect width="300" height="70" rx="6" fill="#1c1b18" stroke="#dfbe76" stroke-width="1.2" opacity="0.92"/>
    <text x="150" y="28" font-family="serif" font-size="14" fill="#dfbe76" text-anchor="middle" letter-spacing="2">EDWARDIAN ERA c. 1910</text>
    <text x="150" y="50" font-family="sans-serif" font-size="12" fill="#c7c3bb" text-anchor="middle">جراموفون بالنفير النحاسي وصندوق ماهوجني</text>
  </g>
</svg>