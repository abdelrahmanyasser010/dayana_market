<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a2824"/>
      <stop offset="60%" stop-color="#181715"/>
      <stop offset="100%" stop-color="#0d0d0c"/>
    </radialGradient>
    <linearGradient id="ironBlack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363636"/>
      <stop offset="40%" stop-color="#1c1c1c"/>
      <stop offset="85%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4d4d4"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <ellipse cx="400" cy="730" rx="270" ry="40" fill="#000" opacity="0.6"/>

  <g filter="url(#shadow)" transform="translate(400, 480)">
    <!-- Heavy Cast-Iron Chassis Frame -->
    <path d="M -230 180 L 230 180 L 200 -80 L -200 -80 Z" fill="url(#ironBlack)" stroke="#444" stroke-width="2"/>

    <!-- Gold Pinstripe Brand Decal (Underwood / Remington) -->
    <text x="0" y="-45" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#dfbe76" text-anchor="middle" letter-spacing="4">UNDERWOOD</text>
    <text x="0" y="-25" font-family="serif" font-size="11" fill="#c5a880" text-anchor="middle" letter-spacing="2">ARABIC STANDARD • 1932</text>

    <!-- Platen Roller & Carriage Assembly on Top -->
    <rect x="-240" y="-140" width="480" height="50" rx="8" fill="#151515" stroke="url(#chrome)" stroke-width="2"/>
    <!-- Paper Sheet inserted (Aged vintage parchment) -->
    <rect x="-140" y="-210" width="280" height="90" fill="#f4ede2" stroke="#d5c8b5"/>
    <text x="-120" y="-170" font-family="serif" font-size="12" fill="#222">حضرة الأديب الأجل / تحية طيبة وبعد ،،</text>
    <text x="-120" y="-150" font-family="serif" font-size="11" fill="#444">وصلنا مقالكم النفيس وسيُنشر بالعدد القادم..</text>

    <!-- Chrome Platen Carriage Return Lever on the Left -->
    <path d="M -230 -120 L -270 -120 L -270 -170 L -250 -170" fill="none" stroke="url(#chrome)" stroke-width="7" stroke-linecap="round"/>

    <!-- Typebars Segment Basket (Radial hammers) -->
    <path d="M -150 -50 C -120 40 120 40 150 -50 Z" fill="#151515" stroke="#333" stroke-width="2"/>
    <!-- Radial typebar steel lines -->
    <g stroke="url(#chrome)" stroke-width="1.8">
      <line x1="-120" y1="-40" x2="0" y2="20"/>
      <line x1="-90" y1="-45" x2="0" y2="20"/>
      <line x1="-60" y1="-48" x2="0" y2="20"/>
      <line x1="-30" y1="-50" x2="0" y2="20"/>
      <line x1="0" y1="-50" x2="0" y2="20"/>
      <line x1="30" y1="-50" x2="0" y2="20"/>
      <line x1="60" y1="-48" x2="0" y2="20"/>
      <line x1="90" y1="-45" x2="0" y2="20"/>
      <line x1="120" y1="-40" x2="0" y2="20"/>
    </g>

    <!-- Twin Ribbon Spools with Black/Red Ribbon -->
    <circle cx="-160" cy="-65" r="26" fill="#111" stroke="url(#chrome)" stroke-width="2"/>
    <circle cx="160" cy="-65" r="26" fill="#111" stroke="url(#chrome)" stroke-width="2"/>

    <!-- Slanted Arabic Circular Glass/Chrome Keys Tier -->
    <g transform="translate(0, 40)">
      <!-- Row 1 -->
      <g transform="translate(-180, 0)">
        <circle cx="20" cy="0" r="14" fill="#f5eedc" stroke="url(#chrome)" stroke-width="2"/>
        <text x="20" y="4" font-family="serif" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">١</text>
        <circle cx="60" cy="0" r="14" fill="#f5eedc" stroke="url(#chrome)" stroke-width="2"/>
        <text x="60" y="4" font-family="serif" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">٢</text>
        <circle cx="100" cy="0" r="14" fill="#f5eedc" stroke="url(#chrome)" stroke-width="2"/>
        <text x="100" y="4" font-family="serif" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">٣</text>
        <circle cx="140" cy="0" r="14" fill="#f5eedc" stroke="url(#chrome)" stroke-width="2"/>
        <text x="140" y="4" font-family="serif" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">٤</text>
        <circle cx="180" cy="0" r="14" fill="#f5eedc" stroke="url(#chrome)" stroke-width="2"/>
        <text x="180" y="4" font-family="serif" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">٥</text>
        <circle cx="220" cy="0" r="14" fill="#f5eedc" stroke="url(#chrome)" stroke-width="2"/>
        <text x="220" y="4" font-family="serif" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">٦</text>
        <circle cx="260" cy="0" r="14" fill="#f5eedc" stroke="url(#chrome)" stroke-width="2"/>
        <text x="260" y="4" font-family="serif" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">٧</text>
        <circle cx="300" cy="0" r="14" fill="#f5eedc" stroke="url(#chrome)" stroke-width="2"/>
        <text x="300" y="4" font-family="serif" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">٨</text>
        <circle cx="340" cy="0" r="14" fill="#f5eedc" stroke="url(#chrome)" stroke-width="2"/>
        <text x="340" y="4" font-family="serif" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">٩</text>
      </g>
      <!-- Row 2 -->
      <g transform="translate(-160, 35)">
        <circle cx="20" cy="0" r="14" fill="#f5eedc" stroke="url(#chrome)" stroke-width="2"/>
        <text x="20" y="4" font-family="serif" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">ق</text>
        <circle cx="60" cy="0" r="14" fill="#f5eedc" stroke="url(#chrome)" stroke-width="2"/>
        <text x="60" y="4" font-family="serif" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">ف</text>
        <circle cx="100" cy="0" r="14" fill="#f5eedc" stroke="url(#chrome)" stroke-width="2"/>
        <text x="100" y="4" font-family="serif" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">غ</text>
        <circle cx="140" cy="0" r="14" fill="#f5eedc" stroke="url(#chrome)" stroke-width="2"/>
        <text x="140" y="4" font-family="serif" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">ع</text>
        <circle cx="180" cy="0" r="14" fill="#f5eedc" stroke="url(#chrome)" stroke-width="2"/>
        <text x="180" y="4" font-family="serif" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">هـ</text>
        <circle cx="220" cy="0" r="14" fill="#f5eedc" stroke="url(#chrome)" stroke-width="2"/>
        <text x="220" y="4" font-family="serif" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">خ</text>
        <circle cx="260" cy="0" r="14" fill="#f5eedc" stroke="url(#chrome)" stroke-width="2"/>
        <text x="260" y="4" font-family="serif" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">ح</text>
        <circle cx="300" cy="0" r="14" fill="#f5eedc" stroke="url(#chrome)" stroke-width="2"/>
        <text x="300" y="4" font-family="serif" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">ج</text>
      </g>
      <!-- Spacebar -->
      <rect x="-130" y="80" width="260" height="18" rx="5" fill="#f5eedc" stroke="url(#chrome)" stroke-width="2"/>
    </g>
  </g>

  <!-- Museum Badge Placard Overlay -->
  <g transform="translate(250, 850)">
    <rect width="300" height="70" rx="6" fill="#1c1b18" stroke="#dfbe76" stroke-width="1.2" opacity="0.92"/>
    <text x="150" y="28" font-family="serif" font-size="14" fill="#dfbe76" text-anchor="middle" letter-spacing="2">LITERARY HERITAGE 1930s</text>
    <text x="150" y="50" font-family="sans-serif" font-size="12" fill="#c7c3bb" text-anchor="middle">آلة كاتبة ميكانيكية بحروف عربية أصلية</text>
  </g>
</svg>