<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#24211d"/>
      <stop offset="60%" stop-color="#141311"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="50%" stop-color="#cccccc"/>
      <stop offset="100%" stop-color="#777777"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <!-- Macro view of Arabic Glass Keytops & Typebars -->
  <g transform="translate(400, 480)">
    <circle cx="0" cy="0" r="230" fill="#151515" stroke="url(#chrome)" stroke-width="8"/>
    <!-- Center Key (حرف الألف والهمزة) -->
    <circle cx="0" cy="0" r="105" fill="#f5eedc" stroke="url(#chrome)" stroke-width="10"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#333" stroke-width="2"/>
    <text x="0" y="24" font-family="Georgia, serif" font-size="80" font-weight="bold" fill="#111" text-anchor="middle">أ</text>
    <text x="0" y="-140" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#dfbe76" text-anchor="middle">UNDERWOOD NO. 5</text>
    <text x="0" y="150" font-family="sans-serif" font-size="14" fill="#aaa" text-anchor="middle">ميكانيكا الطباعة اليدوية ١٩٣٢</text>
  </g>
</svg>