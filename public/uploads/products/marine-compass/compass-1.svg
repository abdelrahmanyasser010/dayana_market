<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a2723"/>
      <stop offset="60%" stop-color="#181614"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </radialGradient>
    <radialGradient id="brass" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff8d8"/>
      <stop offset="35%" stop-color="#e2bf6e"/>
      <stop offset="75%" stop-color="#8f722a"/>
      <stop offset="100%" stop-color="#554112"/>
    </radialGradient>
    <linearGradient id="teak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a2e1b"/>
      <stop offset="50%" stop-color="#2e1a0e"/>
      <stop offset="100%" stop-color="#180d07"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <ellipse cx="400" cy="730" rx="270" ry="40" fill="#000" opacity="0.6"/>

  <g filter="url(#shadow)" transform="translate(400, 480)">
    <!-- Wooden Teak Box Frame -->
    <rect x="-240" y="-180" width="480" height="360" rx="15" fill="url(#teak)" stroke="#664024" stroke-width="4"/>
    <!-- Brass Corner Protectors -->
    <polygon points="-240,-180 -190,-180 -240,-130" fill="url(#brass)"/>
    <polygon points="240,-180 190,-180 240,-130" fill="url(#brass)"/>
    <polygon points="-240,180 -190,180 -240,130" fill="url(#brass)"/>
    <polygon points="240,180 190,180 240,130" fill="url(#brass)"/>

    <!-- Circular Gimbaled Heavy Brass Compass Housing -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#brass)" stroke-width="14"/>
    <!-- Gimbal Pivot Screws -->
    <circle cx="-160" cy="0" r="8" fill="url(#brass)"/>
    <circle cx="160" cy="0" r="8" fill="url(#brass)"/>

    <!-- Compass Inner Bowl (Aged Parchment Dial) -->
    <circle cx="0" cy="0" r="145" fill="#f4ede0" stroke="#4a3512" stroke-width="2"/>
    <!-- Compass Rose Degree Rings -->
    <circle cx="0" cy="0" r="135" fill="none" stroke="#222" stroke-width="1"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#666" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- 16-point Compass Rose Star -->
    <!-- North Point (Fleur-de-lis / Star in Gold & Black) -->
    <polygon points="0,0 -16,-30 0,-115 16,-30" fill="#111"/>
    <polygon points="0,0 0,-115 16,-30" fill="#c5a880"/>
    <!-- South Point -->
    <polygon points="0,0 -14,25 0,105 14,25" fill="#555"/>
    <!-- East & West Points -->
    <polygon points="0,0 25,-14 105,0 25,14" fill="#555"/>
    <polygon points="0,0 -25,-14 -105,0 -25,14" fill="#555"/>

    <!-- Cardinal Directions Typography -->
    <text x="0" y="-120" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#111" text-anchor="middle">N</text>
    <text x="130" y="7" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">E</text>
    <text x="0" y="132" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">S</text>
    <text x="-130" y="7" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">W</text>

    <!-- Center Jeweled Needle Pivot Pivot with Ruby Cap -->
    <circle cx="0" cy="0" r="16" fill="url(#brass)" stroke="#332205" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#aa1122"/>

    <!-- Brass Inscribed Plate on Front Box -->
    <rect x="-100" y="125" width="200" height="36" rx="3" fill="url(#brass)" stroke="#4a300a"/>
    <text x="0" y="142" font-family="serif" font-size="10" font-weight="bold" fill="#221100" text-anchor="middle">SUEZ CANAL MARITIME c. 1885</text>
    <text x="0" y="154" font-family="sans-serif" font-size="8" fill="#442200" text-anchor="middle">KELVIN &amp; WILFRID O. WHITE</text>
  </g>

  <!-- Museum Badge Placard Overlay -->
  <g transform="translate(250, 850)">
    <rect width="300" height="70" rx="6" fill="#1c1b18" stroke="#dfbe76" stroke-width="1.2" opacity="0.92"/>
    <text x="150" y="28" font-family="serif" font-size="14" fill="#dfbe76" text-anchor="middle" letter-spacing="2">MARITIME HOROLOGY c. 1885</text>
    <text x="150" y="50" font-family="sans-serif" font-size="12" fill="#c7c3bb" text-anchor="middle">بوصلة بحرية نحاسية داخل صندوق خشب الساج</text>
  </g>
</svg>