<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#24201c"/>
      <stop offset="60%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#0a0807"/>
    </radialGradient>
    <radialGradient id="brass" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff8d8"/>
      <stop offset="35%" stop-color="#e2bf6e"/>
      <stop offset="75%" stop-color="#8f722a"/>
      <stop offset="100%" stop-color="#554112"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <!-- Macro view of Porcelain dial and Viennese Maker Signature -->
  <g transform="translate(400, 480)">
    <circle cx="0" cy="0" r="240" fill="#fffef7" stroke="url(#brass)" stroke-width="12"/>
    <circle cx="0" cy="0" r="215" fill="none" stroke="#222" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#666" stroke-width="0.8"/>
    <!-- Roman Numerals Macro -->
    <g font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#151515" text-anchor="middle" dominant-baseline="central">
      <text x="0" y="-185">XII</text>
      <text x="95" y="-160">I</text>
      <text x="160" y="-95">II</text>
      <text x="185" y="0">III</text>
      <text x="160" y="95">IV</text>
      <text x="95" y="160">V</text>
      <text x="0" y="185">VI</text>
      <text x="-95" y="160">VII</text>
      <text x="-160" y="95">VIII</text>
      <text x="-185" y="0">IX</text>
      <text x="-160" y="-95">X</text>
      <text x="-95" y="-160">XI</text>
    </g>
    <!-- Viennese Clockmaker Script Signature -->
    <text x="0" y="-55" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#333" text-anchor="middle">Gebrüder Resch</text>
    <text x="0" y="-35" font-family="sans-serif" font-size="12" letter-spacing="3" fill="#666" text-anchor="middle">WIEN</text>
    <!-- Twin Winding Holes with Brass Bushings -->
    <circle cx="-60" cy="50" r="12" fill="#111" stroke="url(#brass)" stroke-width="4"/>
    <circle cx="60" cy="50" r="12" fill="#111" stroke="url(#brass)" stroke-width="4"/>
  </g>
</svg>